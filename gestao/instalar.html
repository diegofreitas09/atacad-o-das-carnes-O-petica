<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#991010"><title>Instalar O Peitica Gestão</title><link rel="manifest" href="manifest.webmanifest?v=11"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f3f1;color:#2b140f;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 18px 50px rgba(54,19,12,.14);text-align:center}.logo{width:92px;height:92px;border-radius:50%;object-fit:contain;margin:auto;background:#fff}.tag{display:inline-block;margin-top:14px;background:#2b0d08;color:#fff;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800}.card h1{margin:16px 0 8px;font-size:28px}.card p{color:#725e58;line-height:1.45}.btn{width:100%;border:0;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:900;background:#b31515;color:#fff;cursor:pointer;margin-top:12px}.btn.secondary{background:#efe7e4;color:#3b211b}.status{margin-top:14px;font-size:13px;color:#6d5a54}.ok{color:#176b35;font-weight:900}.warn{color:#9a5a00;font-weight:800}</style></head><body><main class="card"><img class="logo" src="icon.svg" alt="O Peitica Gestão"><span class="tag">PAINEL ADMINISTRATIVO</span><h1>O Peitica Gestão</h1><p>Instale a Gestão como um aplicativo separado do app do cliente. Depois da instalação, o ícone <b>Peitica Gestão</b> ficará independente na tela inicial.</p><button id="installBtn" class="btn" type="button">⬇️ Instalar Peitica Gestão</button><button id="openBtn" class="btn secondary" type="button">Abrir Gestão sem instalar</button><div id="status" class="status">Aguardando o Chrome liberar a instalação...</div></main><script>
let deferredPrompt=null;const status=document.getElementById('status');const btn=document.getElementById('installBtn');const qs=new URLSearchParams(location.search);const inStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;const isAndroid=/android/i.test(navigator.userAgent);
function chromeIntent(url){const noScheme=url.replace(/^https?:\/\//,'');return 'intent://'+noScheme+'#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url='+encodeURIComponent(url)+';end'}
function forceChrome(){const target=location.origin+location.pathname+'?browser=1&_t='+Date.now();location.href=chromeIntent(target)}
if(inStandalone()){
  status.innerHTML='<span class="warn">Esta página abriu dentro do app O Peitica. Toque abaixo para abrir no Chrome e instalar a Gestão separadamente.</span>';
  btn.textContent='🌐 Abrir no Chrome para instalar';
  btn.onclick=forceChrome;
}else{
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;status.textContent='Pronto para instalar.';btn.disabled=false});
  btn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();try{const r=await deferredPrompt.userChoice;if(r.outcome==='accepted')status.innerHTML='<span class="ok">✓ Instalação confirmada.</span>'}catch(e){}deferredPrompt=null;return}if(isAndroid){status.innerHTML='<span class="warn">Se o instalador não aparecer, toque no menu ⋮ do Chrome e escolha “Instalar app”.</span>'}else status.textContent='Use a opção “Instalar aplicativo” do navegador.'});
}
document.getElementById('openBtn').onclick=()=>location.href='./?app=gestao';
window.addEventListener('appinstalled',()=>{status.innerHTML='<span class="ok">✓ Peitica Gestão instalado com sucesso.</span>';btn.disabled=true;btn.textContent='✓ App instalado'});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=11').catch(()=>{}));
</script></body></html>
